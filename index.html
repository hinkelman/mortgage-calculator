<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Co-buyer Mortgage Calculator</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --panel: #ffffff;
      --ink: #1d1f23;
      --muted: #646a73;
      --line: #e3e1da;
      --field: #fbfaf7;
      --accent: #1f6f5c;
      --a: #2f6fdb;
      --b: #d9822b;
      --warn-bg: #fff4e0;
      --warn-ink: #7a4a00;
      --ok-bg: #e5f4ee;
      --ok-ink: #145240;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171a;
        --panel: #1e2125;
        --ink: #eceae4;
        --muted: #9aa0a8;
        --line: #33373d;
        --field: #181a1d;
        --accent: #5fc4a7;
        --a: #6b9ff0;
        --b: #eba45f;
        --warn-bg: #3a2c12;
        --warn-ink: #f3cf8f;
        --ok-bg: #143128;
        --ok-ink: #9fe0c9;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; }
    .masthead h1 { font-size: 28px; letter-spacing: -0.01em; margin: 0 0 24px; }
    .layout { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
    @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
    .results { display: grid; gap: 20px; min-width: 0; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .inputs { position: sticky; top: 16px; }
    @media (max-width: 860px) { .inputs { position: static; } }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
    .inputs h2:not(:first-child) { margin-top: 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid .field:first-child { grid-column: 1 / -1; }
    .grid.single { margin-top: 12px; grid-template-columns: 1fr; }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.three .field:first-child { grid-column: auto; }
    .facts.flush { margin-top: 0; padding-top: 0; border-top: 0; }
    .table-note { display: block; margin-top: 10px; }
    .field { display: block; min-width: 0; }
    .field-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .input-wrap {
      display: flex; align-items: center;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0 10px;
    }
    .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
    .input-wrap input {
      flex: 1; width: 0; min-width: 0;
      border: 0; background: transparent; color: var(--ink);
      font: inherit; padding: 9px 0; outline: none;
      font-variant-numeric: tabular-nums;
    }
    .prefix, .suffix { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .prefix { margin-right: 4px; }
    .suffix { margin-left: 6px; }
    .buyers { display: grid; gap: 12px; }
    .buyer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-left: 12px; border-left: 3px solid; }
    .buyer-a { border-color: var(--a); }
    .buyer-b { border-color: var(--b); }
    .eyebrow { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 600; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
    .dot-a { background: var(--a); }
    .dot-b { background: var(--b); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
    .num { text-align: right; }
    .contrib td:first-child { white-space: nowrap; }
    .strong { font-weight: 700; }
    .contrib { margin-top: 16px; }
    .seg-a { background: var(--a); }
    .seg-b { background: var(--b); }
    .callout { border-radius: 10px; padding: 12px 14px; margin: 16px 0 0; }
    .callout.warn { background: var(--warn-bg); color: var(--warn-ink); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .tile { border: 1px solid var(--line); border-top: 4px solid; border-radius: 10px; padding: 12px 14px; display: grid; min-width: 0; }
    .tile-a { border-top-color: var(--a); }
    .tile-b { border-top-color: var(--b); }
    .tile-name { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tile-value { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .tile-unit { color: var(--muted); font-size: 15px; font-weight: 500; letter-spacing: 0; }
    .tile-note { color: var(--muted); font-size: 13px; }
    .explain { margin: 16px 0 0; }
    .stacks { display: grid; gap: 8px; margin-top: 16px; }
    .stack-row { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 10px; }
    .stack-name { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; }
    .stack-seg.paid { opacity: .45; }
    .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--muted); }
    .swatch.paid { opacity: .45; }
    .bill tr:last-child td { border-bottom: 0; }
    .bill .total td { font-weight: 700; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .fact { display: grid; }
    .fact-label { font-size: 12px; color: var(--muted); }
    .fact-value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .errors { margin: 0; padding-left: 18px; color: var(--warn-ink); }
    .notes { color: var(--muted); font-size: 13px; margin-top: 24px; max-width: 80ch; }
    @media (max-width: 480px) {
      .buyer, .grid, .grid.three { grid-template-columns: 1fr; }
      .contrib th, .contrib td { padding: 8px 4px; font-size: 13px; }
      .tile-value { font-size: 26px; }
      .split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
  <script>Elm.Main.init({ node: document.getElementById("app") });</script>
</body>
</html>
